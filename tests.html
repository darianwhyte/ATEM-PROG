<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <title>ATEM-PROG Engine & UI Test Suite</title>
    <link rel="icon" type="image/svg+xml" href="assets/atem-prog-icon.svg">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px;
            background: #0a0d12;
            color: #e6ebf4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
        }
        .wrap { max-width: 980px; margin: 0 auto; }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #232a38;
            padding-bottom: 14px;
            margin-bottom: 18px;
        }
        h1 { margin: 0; font-size: 18px; color: #22d3ee; letter-spacing: 0.04em; }
        .btn {
            background: #0891b2;
            color: #031218;
            border: 1px solid #22d3ee;
            border-radius: 5px;
            padding: 6px 14px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
        }
        .summary {
            display: flex;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 6px;
            background: #12161f;
            border: 1px solid #232a38;
            margin-bottom: 18px;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 12px;
        }
        .summary.ok { border-color: #16a34a; }
        .summary.bad { border-color: #dc2626; }
        .suite {
            background: #12161f;
            border: 1px solid #232a38;
            border-radius: 6px;
            margin-bottom: 14px;
            overflow: hidden;
        }
        .suite-title {
            padding: 9px 14px;
            background: #161b26;
            border-bottom: 1px solid #232a38;
            font-weight: 700;
            font-size: 12px;
            color: #22d3ee;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .test-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 14px;
            border-bottom: 1px solid #1c2230;
        }
        .test-row:last-child { border-bottom: none; }
        .badge {
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .badge.pass { background: rgba(22, 163, 74, 0.2); color: #4ade80; border: 1px solid #16a34a; }
        .badge.fail { background: rgba(220, 38, 38, 0.25); color: #f87171; border: 1px solid #dc2626; }
        .badge.skip { background: rgba(217, 119, 6, 0.2); color: #fbbf24; border: 1px solid #d97706; }
        .err-msg { color: #f87171; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; margin-top: 4px; }
        .ms { color: #657188; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <div>
            <h1>ATEM-PROG Engine & UI Test Suite</h1>
            <div style="color:#98a4b8; font-size:11px; margin-top:3px;">Full browser regression runner — Engine + Native DOMParser XML Round-Trip + Live DOM / Canvas UI E2E</div>
        </div>
        <button id="btnRerun" class="btn">▶ Re-Run All Tests</button>
    </header>
    <div id="summary" class="summary">Running tests...</div>
    <div id="output"></div>
</div>

<!-- Lightweight AppUI harness so all production views mount cleanly in test mode -->
<script>
    const elements = {};
    const AppUI = {
        activeView: "switcher",
        activeME: 0,
        _proMode: false,
        esc(val) {
            return String(val ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        },
        isProMode() { return this._proMode; },
        setProMode(v) { this._proMode = !!v; },
        toast() {},
        refresh() {},
        navigate(v) { this.activeView = v; },
        renderHeader() {},
        renderLiveTick() {},
        renderMacroPreview() {},
        updateRecordingPill() {},
        getSkipStart() { return false; },
        setSkipStart() {}
    };
    const _noopProxy = new Proxy({}, { get: () => () => {} });
    const SidebarUI = _noopProxy;
    const IoUI = _noopProxy;
    function buildUSKs() {}
    function buildSuperSourceLayers() {}
    function validateSelectedLayer() {}
</script>

<!-- Production Engine & UI Modules -->
<script src="js/profiles.js"></script>
<script src="js/state.js"></script>
<script src="js/sources.js"></script>
<script src="js/atem-xml.js"></script>
<script src="js/layout.js"></script>
<script src="js/engine/ss-animator.js"></script>
<script src="js/engine/stream-rec.js"></script>
<script src="js/engine.js"></script>
<script src="js/history.js"></script>
<script src="js/storage.js"></script>
<script src="js/templates.js"></script>
<script src="js/macro.js"></script>
<script src="js/record-macro.js"></script>
<script src="js/playback-macro.js"></script>
<script type="module" src="js/canvas-renderer.js"></script>
<script src="js/popout.js"></script>
<script type="module" src="js/core/actions.js"></script>
<script type="module" src="js/atem-bridge.js"></script>
<script src="js/patch-sheet.js"></script>
<script src="js/import.js"></script>
<script src="js/export.js"></script>
<script type="module" src="js/ui/overlays.js"></script>
<script type="module" src="js/ui/view-switcher.js"></script>
<script type="module" src="js/ui/view-compose.js"></script>
<script src="js/ui/view-routing.js"></script>
<script src="js/ui/view-macros.js"></script>
<script src="js/ui/view-media.js"></script>
<script src="tests/engine.test.js"></script>
<script src="tests/ui.test.js"></script>
<script src="tests/sync.test.js"></script>

<script type="module">
    async function executeTests() {
        // Snapshot ALL atem_prog_* / atemProg_* localStorage keys so running tests never alters user's real show or layouts!
        const backup = new Map();
        for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && (k.startsWith("atem_prog_") || k.startsWith("atemProg_"))) backup.set(k, localStorage.getItem(k));
        }

        try {
            const engReport = await AtemTestSuite.runAll();
            const uiReport = await AtemUiTestSuite.runAll();
            const syncReport = typeof AtemSyncTestSuite !== "undefined"
                ? await AtemSyncTestSuite.runAll()
                : { results: [], passed: 0, failed: 0, skipped: 0, total: 0 };

            const report = {
                results: [...engReport.results, ...uiReport.results, ...syncReport.results],
                passed: engReport.passed + uiReport.passed + syncReport.passed,
                failed: engReport.failed + uiReport.failed + syncReport.failed,
                skipped: engReport.skipped + uiReport.skipped + syncReport.skipped,
                total: engReport.total + uiReport.total + syncReport.total
            };
            window.__ATEM_TEST_REPORT__ = report;

            const sumEl = document.getElementById("summary");
            sumEl.className = `summary ${report.failed === 0 ? "ok" : "bad"}`;
            sumEl.innerHTML = `
                <span>Total: <strong>${report.total}</strong></span>
                <span style="color:#4ade80;">Passed: <strong>${report.passed}</strong></span>
                <span style="color:${report.failed ? "#f87171" : "#657188"};">Failed: <strong>${report.failed}</strong></span>
                <span style="color:#fbbf24;">Skipped: <strong>${report.skipped}</strong></span>
            `;

            const out = document.getElementById("output");
            out.innerHTML = "";
            report.results.forEach(suite => {
                const card = document.createElement("div");
                card.className = "suite";
                const title = document.createElement("div");
                title.className = "suite-title";
                title.textContent = suite.name;
                card.appendChild(title);

                suite.tests.forEach(t => {
                    const row = document.createElement("div");
                    row.className = "test-row";

                    const left = document.createElement("div");
                    left.style.flex = "1";
                    const nameEl = document.createElement("div");
                    nameEl.textContent = t.name;
                    left.appendChild(nameEl);
                    if (t.message) {
                        const msg = document.createElement("div");
                        msg.className = "err-msg";
                        msg.textContent = t.message;
                        left.appendChild(msg);
                    }

                    const right = document.createElement("div");
                    right.style.display = "flex";
                    right.style.alignItems = "center";
                    right.style.gap = "8px";
                    right.innerHTML = `<span class="ms">${t.ms}ms</span><span class="badge ${t.status}">${t.status.toUpperCase()}</span>`;

                    row.appendChild(left);
                    row.appendChild(right);
                    card.appendChild(row);
                });

                out.appendChild(card);
            });
        } finally {
            // Restore exact original atem_prog_* / atemProg_* localStorage state
            for (let i = localStorage.length - 1; i >= 0; i--) {
                const k = localStorage.key(i);
                if (k && (k.startsWith("atem_prog_") || k.startsWith("atemProg_"))) localStorage.removeItem(k);
            }
            backup.forEach((v, k) => localStorage.setItem(k, v));
        }
    }

    document.getElementById("btnRerun").addEventListener("click", executeTests);
    executeTests();
</script>
</body>
</html>
